context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-aws-sdk
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake
    - if: unix
      then:
        - make
    - aws-sdk-cpp
  host:
    - aws-sdk-cpp
  run: 
    - aws-sdk-cpp

tests:
  - script:
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/awssdk.li64.so
    - if: linux and aarch64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/awssdk.la64.so
    - if: osx and arm64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/awssdk.ma64.so
    - if: osx and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/awssdk.mi64.so
    - if: win
      then:
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\\awssdk.wi64.dll exit 1

about:
  homepage: https://github.com/KxSystems/awssdk
  repository: https://github.com/KxSystems/awssdk
  license: Apache-2.0
  license_file: LICENSE
  summary: kdb-x APIs to authenticate using the AWS C++ SDK.
  description: >-
    kdb-x module wrapping the official AWS C++ SDK. Provides AWS credential
    resolution via the standard AWS authentication chain, S3 client creation,
    and listing of S3 objects with or without object metadata.
